<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - FoodieDrop</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-utensils"></i> FoodieDrop
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
            </ul>
            <div class="nav-icons">
                <button class="theme-toggle" title="Toggle theme">
                    <i class="fas fa-moon"></i> Dark
                </button>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Checkout Section -->
    <section class="checkout-section">
        <div class="container">
            <h2>Checkout</h2>
            
            <div class="checkout-wrapper">
                <!-- Checkout Form -->
                <div class="checkout-form">
                    <div class="form-section">
                        <h3>Delivery Address</h3>
                        <form id="checkoutForm" onsubmit="handleCheckout(event)">
                            <div class="form-group">
                                <input type="text" placeholder="Full Name" required>
                            </div>
                            <div class="form-group">
                                <input type="email" placeholder="Email Address" required>
                            </div>
                            <div class="form-group">
                                <input type="tel" placeholder="Phone Number" required>
                            </div>
                            <div class="form-group">
                                <input type="text" placeholder="Street Address" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <input type="text" placeholder="City" required>
                                </div>
                                <div class="form-group">
                                    <input type="text" placeholder="Postal Code" required>
                                </div>
                            </div>
                            
                            <h3>Payment Method</h3>
                            <div class="payment-options">
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="card" checked>
                                    <span><i class="fas fa-credit-card"></i> Credit Card</span>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="debit">
                                    <span><i class="fas fa-university"></i> Debit Card</span>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="wallet">
                                    <span><i class="fas fa-wallet"></i> Digital Wallet</span>
                                </label>
                            </div>

                            <h3>Card Details</h3>
                            <div class="form-group">
                                <input type="text" placeholder="Card Number" pattern="\d{16}" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <input type="text" placeholder="MM/YY" required>
                                </div>
                                <div class="form-group">
                                    <input type="text" placeholder="CVV" pattern="\d{3}" required>
                                </div>
                            </div>

                            <label class="checkbox">
                                <input type="checkbox" required>
                                <span>I agree to the terms and conditions</span>
                            </label>

                            <button type="submit" class="btn btn-primary full-width">
                                Place Order
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div id="summaryItems"></div>
                    
                    <div class="summary-item">
                        <span>Subtotal:</span>
                        <span id="summarySubtotal">LKR 0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Tax (10%):</span>
                        <span id="summaryTax">LKR 0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Delivery:</span>
                        <span id="summaryDelivery">LKR 2.00</span>
                    </div>
                    <div class="summary-item total">
                        <span>Total:</span>
                        <span id="summaryTotal">LKR 0.00</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                           </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 FoodieDrop. All rights reserved.</p>
        </div>
    </footer>

    <script src="../static/js/checkout.js"></script>
    <script src="../static/js/theme.js"></script>
</body>
</html>
